name: iOS Build

on:
  push:
    paths-ignore:
      - 'android/**'
      - 'apidoc/**'
  pull_request:
    paths-ignore:
      - 'android/**'
      - 'apidoc/**'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    name: iOS
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Cache Node.js modules
      id: node-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.OS }}-node-modules-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.OS }}-node-modules-
          ${{ runner.OS }}-

    - name: Install dependencies
      run: npm ci
      if: steps.node-cache.outputs.cache-hit != 'true'

    - name: Install Titanium CLI
      run: npm i -g titanium

    - name: Install Titanium SDK
      run: ti sdk install 13.2.0.GA

    - name: Set to Build with 13.2.0.GA SDK
      run: sed -i .bak 's/TITANIUM_SDK_VERSION = .*/TITANIUM_SDK_VERSION = 13.2.0.GA/' ios/titanium.xcconfig

    - name: Build iOS Module
      run: |
        cd ios
        ti build -p ios --build-only

    - name: Archive iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ti.admob-ios
        path: ios/dist/*.zip